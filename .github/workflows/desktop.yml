name: Build Desktop (Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'server/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
            name: maestro-windows-x64
          # macOS universal (Intel + Apple Silicon)
          - os: macos-latest
            target: universal-apple-darwin
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            name: maestro-macos-universal
          # Linux x64 (glibc)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
            name: maestro-linux-x64
          # Linux x64 (musl, static) — requires zig as linker
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifacts: |
              src-tauri/target/x86_64-unknown-linux-musl/release/maestro
            name: maestro-linux-musl-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install with `npm install`, not `npm ci`: the committed lockfile can
      # drift out of sync with the resolution that newer npm produces (e.g.
      # lru-cache), which makes strict `npm ci` fail. `npm install` reconciles.

      # rustup already on GH runners; add the target triple(s) + musl zig tools.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin aarch64-apple-darwin' || matrix.target }}

      - name: Install Linux (glibc) webkit deps
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Linux (musl) deps + zig
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libssl-dev gcc-multilib
          # Zig provides cc for musl cross-linking in Tauri.
          pip3 --version >/dev/null 2>&1 || sudo apt-get install -y python3-pip
          # Use the rustup-bundled approach via cargo-zigbuild is unreliable; use zig directly.
          sudo apt-get install -y zig || (sudo snap install zig --classic || true)

      - name: Install frontend deps
        run: npm install

      - name: Build frontend (.output)
        run: |
          npm run build
          node scripts/fix-ssr-css-refs.mjs .output

      - name: Fetch backend sidecar (Node runtime)
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            # Universal macOS bundles BOTH arch node sidecars.
            node scripts/fetch-sidecar.mjs --target x86_64-apple-darwin
            node scripts/fetch-sidecar.mjs --target aarch64-apple-darwin
          else
            node scripts/fetch-sidecar.mjs --target ${{ matrix.target }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target: ${{ matrix.target }}
          args: --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
