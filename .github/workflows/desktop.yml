name: Build Desktop (Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'server/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
            name: maestro-windows-x64
          # macOS universal (Intel + Apple Silicon)
          - os: macos-latest
            target: universal-apple-darwin
            artifacts: |
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/dmg/*.dmg
            name: maestro-macos-universal
          # Linux x64 (glibc)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
            name: maestro-linux-x64
          # (No musl target: Tauri webview apps link webkit2gtk/GTK, which is
          #  glibc-only — a static musl binary cannot link it. Linux glibc covers
          #  all mainstream desktop distros, incl. Alpine via glibc compat.)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install with `npm install`, not `npm ci`: the committed lockfile can
      # drift out of sync with the resolution that newer npm produces (e.g.
      # lru-cache), which makes strict `npm ci` fail. `npm install` reconciles.

      # rustup already on GH runners; add the target triple(s) (musl dropped —
      # Tauri webview links webkit2gtk/GTK which is glibc-only; a static musl
      # binary can't link it, so Linux glibc is the desktop target).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin aarch64-apple-darwin' || matrix.target }}

      - name: Install Linux deps
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm install

      - name: Build frontend (.output)
        # Uses the cross-platform script: it drives Vite's JS build API directly
        # (the `npm run build` wrapper's `spawn("vite")` cannot resolve the .cmd
        # shim on a native Windows runner), then reconciles SSR CSS refs.
        run: node scripts/build-frontend.mjs

      - name: Fetch backend sidecar (Node runtime)
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            # Universal macOS bundles BOTH arch node sidecars.
            node scripts/fetch-sidecar.mjs --target x86_64-apple-darwin
            node scripts/fetch-sidecar.mjs --target aarch64-apple-darwin
          else
            node scripts/fetch-sidecar.mjs --target ${{ matrix.target }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target: ${{ matrix.target }}
          args: --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
