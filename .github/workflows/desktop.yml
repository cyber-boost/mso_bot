name: Build Desktop (Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (host arch; output stays in target/release/bundle)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_args: "--verbose"
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
            name: maestro-windows-x64
          # macOS universal (Intel + Apple Silicon). tauri-action@v0
          # dropped the `target:` input (it warns + ignores it), so
          # --target travels via args; a --target build emits to
          # target/<triple>/release/bundle, hence the globs below.
          - os: macos-latest
            target: universal-apple-darwin
            build_args: "--target universal-apple-darwin --verbose"
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            name: maestro-macos-universal
          # Linux x64 (glibc; host arch)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build_args: "--verbose"
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
            name: maestro-linux-x64
          # (No musl target: Tauri webview apps link webkit2gtk/GTK, which is
          #  glibc-only — a static musl binary cannot link it. Linux glibc covers
          #  all mainstream desktop distros, incl. Alpine via glibc compat.)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install with `npm install`, not `npm ci`: the committed lockfile can
      # drift out of sync with the resolution that newer npm produces (e.g.
      # lru-cache), which makes strict `npm ci` fail. `npm install` reconciles.

      # rustup already on GH runners; add the target triple(s) (musl dropped —
      # Tauri webview links webkit2gtk/GTK which is glibc-only; a static musl
      # binary can't link it, so Linux glibc is the desktop target).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin aarch64-apple-darwin' || matrix.target }}

      - name: Install Linux deps
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm install

      - name: Build frontend (.output)
        # Uses the cross-platform script: it drives Vite's JS build API directly
        # (the `npm run build` wrapper's `spawn("vite")` cannot resolve the .cmd
        # shim on a native Windows runner), then reconciles SSR CSS refs.
        run: node scripts/build-frontend.mjs

      - name: Fetch backend sidecar (Node runtime)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            # Universal macOS bundles BOTH arch node sidecars.
            node scripts/fetch-sidecar.mjs --target x86_64-apple-darwin
            node scripts/fetch-sidecar.mjs --target aarch64-apple-darwin
          else
            node scripts/fetch-sidecar.mjs --target ${{ matrix.target }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The `target:` input no longer exists in tauri-action@v0 —
          # passing it only produces a warning and it is silently
          # ignored. --target goes through args (see matrix build_args).
          args: ${{ matrix.build_args }}

      - name: Verify universal binary (macOS)
        # Gate: an arm64-only binary claiming to be "universal" fails
        # the build instead of shipping silently.
        if: matrix.target == 'universal-apple-darwin'
        run: |
          app=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "app binary: $bin"
          archs="$(lipo -archs "$bin")"
          echo "archs: $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "NOT universal: x86_64 slice missing" >&2; exit 1 ;;
          esac
          case "$archs" in
            *arm64*) ;;
            *) echo "NOT universal: arm64 slice missing" >&2; exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
