services:
  maestro:
    # Runs the prebuilt Nitro node-server artifact directly — no image build,
    # nothing to diverge from stale caches. The artifact is bound from the host.
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app/.output
    command: ["node", "server/index.mjs"]
    volumes:
      - ./.output:/app/.output
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      # Persist the embedded PGLite database (channels, etc.) onto the host via
      # the .output bind mount so it survives container restarts and rebuilds.
      - PGLITE_DIR=/app/.output/.pglite-data
      # Optional server-side xAI key.
      # - XAI_API_KEY=your-xai-key-here
